
[project]
name = "cotizador"
version = "0.1.0"
description = "Sistema de cotizaciones y facturación para PYMES"
readme = "README.md"
requires-python = ">= 3.11"
authors = [{name = "Johnny Llamoja Peralta", email = "llamojajohnny@gmail.com"}]
dependencies = ["pydantic>=2.9.0",]
[project.optional-dependencies]
dev = ["pytest>=8.3.0",
       "pytest-cov>=6.0.0",
       "ruff>=0.7.0",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool-ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","N","W","UP","B","C4","SIM"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"
